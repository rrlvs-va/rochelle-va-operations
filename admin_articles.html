<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Articles | The Rochelle Edit Admin</title>
<style>
:root{--ink:#11100f;--panel:#201b18;--text:#f7f1ea;--muted:#b9aca1;--gold:#d1ab63;--blush:#cb8f96;--line:#3b312a;--green:#9db79e;--danger:#d69a9f}*{box-sizing:border-box}body{margin:0;background:#0e0d0c;color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{border-right:1px solid var(--line);background:#151311;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font:500 1.16rem Georgia,serif;margin-bottom:5px}.sub{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.68rem}.nav{display:grid;gap:5px;margin-top:28px}.nav a{color:#c8bdb4;text-decoration:none;padding:10px 11px;border-radius:8px;font-size:.88rem;transition:.18s}.nav a.active,.nav a:hover,.nav a:focus-visible{background:#28211d;color:#fff;outline:none;transform:translateX(2px)}.account{position:absolute;left:18px;right:18px;bottom:20px;border-top:1px solid var(--line);padding-top:16px;font-size:.8rem;color:#b5a69b}.account strong{color:#f1e7de}.signout{margin-top:11px;border:1px solid #5a493c;background:transparent;color:#d8cbc1;border-radius:999px;padding:7px 11px;cursor:pointer}.main{min-width:0}.topbar{min-height:68px;border-bottom:1px solid var(--line);background:#12100f;display:flex;align-items:center;justify-content:space-between;padding:12px 26px;position:sticky;top:0;z-index:5}.topbar strong{font:500 1.08rem Georgia,serif}.new-link,.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;padding:9px 14px;font-weight:750;font-size:.82rem;transition:.18s}.new-link{background:var(--gold);color:#17110d}.content{padding:34px;max-width:1180px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--blush);font-size:.68rem;font-weight:800}.content h1{font:500 clamp(2.5rem,5vw,4rem)/1 Georgia,serif;margin:10px 0}.lead{color:var(--muted);max-width:760px;margin:0 0 28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #4d4036;border-radius:999px;padding:8px 12px;color:#c9bbb0;font-size:.78rem;background:transparent;cursor:pointer}.tab.active{border-color:var(--gold);color:var(--gold)}.article-list{border-top:1px solid var(--line)}.article-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}.status{display:inline-block;color:var(--green);font-size:.7rem;text-transform:uppercase;letter-spacing:.11em;font-weight:800;margin-bottom:7px}.status.trash{color:var(--danger)}.article-title{font:500 1.45rem/1.15 Georgia,serif;margin:0 0 6px}.meta{color:#9f9288;font-size:.78rem}.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.action{border:1px solid #5a493c;color:#eee4dc;background:transparent;cursor:pointer}.action:hover,.action:focus-visible{border-color:var(--gold);background:#28211d;color:#fff;transform:translateY(-1px);outline:none}.action.view{color:var(--gold)}.action.danger{color:#e4b4b8;border-color:#6a4548}.action:disabled{opacity:.4;cursor:not-allowed;transform:none}.notice{margin-top:24px;padding:16px 18px;border:1px solid #4c3e34;background:#171412;color:#b9aca1;font-size:.88rem}.notice.good{border-color:#49604a}.notice.bad{border-color:#754b4e}.empty{padding:28px 0;color:#8f8177;border-bottom:1px solid var(--line)}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:26px}.article-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}}@media(max-width:620px){.topbar{padding:12px 14px}.content{padding:22px 16px}.row-actions{display:grid;grid-template-columns:1fr 1fr}.action{width:100%}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">The Rochelle Edit</div><div class="sub">Admin</div><nav class="nav"><a href="/admin/editor">New article</a><a class="active" href="/admin/articles">Articles</a><a href="__SITE_ORIGIN__/experiments/blog-cms-preview/">View blog</a><a href="__SITE_ORIGIN__/">Main website</a></nav><div class="account">Signed in<br><strong>Rochelle V. Silvestre</strong><form method="post" action="/logout"><button class="signout" type="submit">Sign out</button></form></div></aside><main class="main"><div class="topbar"><strong>Articles</strong><a class="new-link" href="/admin/editor">New article</a></div><div class="content"><div class="eyebrow">Manage content</div><h1>Articles</h1><p class="lead">Publish, unpublish, move posts to Trash, restore them, or delete them permanently.</p><div class="tabs"><button class="tab active" data-filter="published">Published · <span id="countPublished">0</span></button><button class="tab" data-filter="unpublished">Unpublished · <span id="countUnpublished">0</span></button><button class="tab" data-filter="trash">Trash · <span id="countTrash">0</span></button></div><div class="article-list" id="articleList"><div class="empty">Loading articles…</div></div><div class="notice" id="notice">Checking publishing connection…</div></div></main></div>
<script>
const CSRF='__CSRF__';let articles=[];let filter='published';let writeReady=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>{if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});};
function render(){document.getElementById('countPublished').textContent=articles.filter(a=>a.status==='published').length;document.getElementById('countUnpublished').textContent=articles.filter(a=>a.status==='unpublished').length;document.getElementById('countTrash').textContent=articles.filter(a=>a.status==='trash').length;const items=articles.filter(a=>a.status===filter);const box=document.getElementById('articleList');if(!items.length){box.innerHTML='<div class="empty">No '+esc(filter)+' articles.</div>';return;}box.innerHTML=items.map(a=>{let actions=`<a class="action" href="/admin/editor?edit=${encodeURIComponent(a.slug)}">Edit</a>`;if(a.status==='published')actions+=`<a class="action view" href="__SITE_ORIGIN__/experiments/blog-cms-preview/article.html?slug=${encodeURIComponent(a.slug)}">View</a><button class="action" ${writeReady?'':'disabled'} onclick="changeStatus('${encodeURIComponent(a.slug)}','unpublished')">Unpublish</button><button class="action danger" ${writeReady?'':'disabled'} onclick="changeStatus('${encodeURIComponent(a.slug)}','trash')">Move to Trash</button>`;if(a.status==='unpublished')actions+=`<button class="action" ${writeReady?'':'disabled'} onclick="changeStatus('${encodeURIComponent(a.slug)}','published')">Publish</button><button class="action danger" ${writeReady?'':'disabled'} onclick="changeStatus('${encodeURIComponent(a.slug)}','trash')">Move to Trash</button>`;if(a.status==='trash')actions+=`<button class="action" ${writeReady?'':'disabled'} onclick="changeStatus('${encodeURIComponent(a.slug)}','published')">Restore</button><button class="action danger" ${writeReady?'':'disabled'} onclick="deleteForever('${encodeURIComponent(a.slug)}','${esc(a.title).replace(/'/g,'&#39;')}')">Delete permanently</button>`;return `<article class="article-row"><div><span class="status ${a.status==='trash'?'trash':''}">${esc(a.status)}</span><h2 class="article-title">${esc(a.title)}</h2><div class="meta">${esc(fmt(a.publish_date))} · ${esc(a.author||'Rochelle V. Silvestre')}</div></div><div class="row-actions">${actions}</div></article>`;}).join('');}
async function load(){const r=await fetch('/admin/api/articles',{cache:'no-store'});if(!r.ok){document.getElementById('notice').textContent='Could not load article storage.';return;}const d=await r.json();articles=d.articles||[];writeReady=!!d.write_ready;const n=document.getElementById('notice');n.className='notice '+(writeReady?'good':'bad');n.textContent=writeReady?'Publishing connection is ready. Article actions are active.':'Article list is readable, but publishing changes need the GitHub publishing credential in Wasmer.';render();}
async function mutate(url,method,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.detail||'That change could not be completed.');return false;}await load();return true;}
function changeStatus(slug,status){mutate('/admin/api/articles/'+slug+'/status','POST',{status});}function deleteForever(slug,title){if(confirm('Delete “'+title+'” permanently? This removes it from the blog content store.'))mutate('/admin/api/articles/'+slug,'DELETE');}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();}));load();
</script></body></html>

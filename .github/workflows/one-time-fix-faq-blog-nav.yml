name: One-time fix FAQ Blog navigation

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-faq-blog-nav.yml'

permissions:
  contents: write

jobs:
  fix-faq-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix FAQ Blog link placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('faq.html')
          text = p.read_text(encoding='utf-8')
          duplicate = '''      <a href="service-policies.html">Service Policies</a>\n      <a href="experiments/blog-cms-preview/">Blog</a><a href="privacy.html">Privacy</a>\n      <a href="experiments/blog-cms-preview/">Blog</a>\n      <a class="btn outline" href="#contact">Contact</a>'''
          corrected = '''      <a href="service-policies.html">Service Policies</a>\n      <a href="privacy.html">Privacy</a>\n      <a href="experiments/blog-cms-preview/">Blog</a>\n      <a class="btn outline" href="#contact">Contact</a>'''
          if duplicate not in text:
              raise SystemExit('FAQ duplicate Blog navigation marker not found')
          text = text.replace(duplicate, corrected, 1)
          footer_old = '<div class="footer-links"><a href="index.html">Main website</a><a href="about.html">About</a><a href="service-policies.html">Service Policies</a><a href="privacy.html">Privacy</a><a href="#contact">Contact</a></div>'
          footer_new = '<div class="footer-links"><a href="index.html">Main website</a><a href="about.html">About</a><a href="service-policies.html">Service Policies</a><a href="experiments/blog-cms-preview/">Blog</a><a href="privacy.html">Privacy</a><a href="#contact">Contact</a></div>'
          if footer_old not in text:
              raise SystemExit('FAQ footer marker not found')
          text = text.replace(footer_old, footer_new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-fix-faq-blog-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faq.html .github/workflows/one-time-fix-faq-blog-nav.yml
          git commit -m "Fix FAQ Blog navigation"
          git push

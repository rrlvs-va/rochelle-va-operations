name: Wire contact forms

on:
  workflow_dispatch:
    inputs:
      endpoint_url:
        description: "Public Wasmer endpoint base URL, e.g. https://example.wasmer.app"
        required: true
        type: string

permissions:
  contents: write

jobs:
  wire-forms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wire all website contact forms
        run: python backend/apply_contact_forms.py "${{ inputs.endpoint_url }}"

      - name: Commit form changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html faq.html service-policies.html privacy.html
          git commit -m "Route website contact forms to secure Notion endpoint"
          git push origin HEAD:main

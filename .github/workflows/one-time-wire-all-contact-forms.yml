name: One-time wire all contact forms

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-wire-all-contact-forms.yml

permissions:
  contents: write

jobs:
  wire-forms:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Route every website contact form to the secure Wasmer endpoint
        run: python backend/apply_contact_forms.py "https://rochelle-va-inquiries.wasmer.app"

      - name: Commit form changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html faq.html service-policies.html privacy.html
          git commit -m "Route all website contact forms to Notion endpoint"
          git push origin HEAD:main

# cleanup run: route standalone contact buttons to the onsite forms

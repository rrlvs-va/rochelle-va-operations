name: One-time logo removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-site-logo-once.yml'

permissions:
  contents: write

jobs:
  remove-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove logo from site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('index.html'),
              Path('about.html'),
              Path('faq.html'),
              Path('service-policies.html'),
              Path('privacy.html'),
              Path('blog/index.html'),
              Path('blog/archive.html'),
              Path('blog/article.html'),
          ]

          logo_css = '''
/* SITE LOGO */
.brand.site-branding{flex-direction:row;align-items:center;gap:10px}
.brand-copy{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.site-logo{width:44px;height:44px;object-fit:contain;flex:0 0 auto;display:block}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-logo{width:58px;height:58px;object-fit:contain;flex:0 0 auto;display:block}
@media(max-width:720px){.site-logo{width:38px;height:38px}.footer-logo{width:50px;height:50px}.footer-brand{align-items:flex-start}}
'''

          brand_re = re.compile(
              r'<a class="brand site-branding"(?P<attrs>[^>]*)><img class="site-logo"[^>]*><div class="brand-copy">(?P<inner>.*?)</div></a>',
              re.S,
          )
          footer_re = re.compile(
              r'<div class="footer-brand"><img class="footer-logo"[^>]*><div>(?P<inner>.*?)</div></div>',
              re.S,
          )

          for path in pages:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace(logo_css, '')
              text = brand_re.sub(lambda m: '<a class="brand"' + m.group('attrs') + '>' + m.group('inner') + '</a>', text)
              text = footer_re.sub(lambda m: '<div>' + m.group('inner') + '</div>', text)
              path.write_text(text, encoding='utf-8')
          PY

          rm -f assets/rochelle-v-silvestre-logo.png
          rm -f .github/workflows/remove-site-logo-once.yml

      - name: Commit logo removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Remove logo from site"
          git push origin HEAD:main

name: One-time site cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clean retired files and update footer links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root_pages = [
              Path('index.html'),
              Path('about.html'),
              Path('faq.html'),
              Path('service-policies.html'),
              Path('privacy.html'),
          ]
          blog_pages = [
              Path('blog/index.html'),
              Path('blog/archive.html'),
              Path('blog/article.html'),
          ]

          linkedin = 'https://www.linkedin.com/in/rochelle-v-silvestre'
          instagram = 'https://www.instagram.com/rvs_va.ops/'

          def update_footer(path: Path):
              text = path.read_text(encoding='utf-8')

              if path in root_pages:
                  text = text.replace('experiments/blog-cms-preview/', 'blog/')

              match = re.search(r'<footer\b.*?</footer>', text, flags=re.S | re.I)
              if not match:
                  path.write_text(text, encoding='utf-8')
                  return

              footer = match.group(0)
              if linkedin not in footer:
                  if 'footer-right' in footer:
                      style = ' style="display:inline-block;margin-top:8px;margin-right:12px;color:#d7b36a;border-bottom:1px solid rgba(215,179,106,.45);"'
                      socials = (
                          f'<a href="{linkedin}" target="_blank" rel="noopener noreferrer"{style}>LinkedIn</a>\n      '
                          f'<a href="{instagram}" target="_blank" rel="noopener noreferrer"{style}>Instagram</a>\n      '
                      )
                  else:
                      socials = (
                          f'<a href="{linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn</a>'
                          f'<a href="{instagram}" target="_blank" rel="noopener noreferrer">Instagram</a>'
                      )

                  contact = re.search(r'<a\b[^>]*>Contact</a>', footer, flags=re.I)
                  if contact:
                      footer = footer[:contact.start()] + socials + footer[contact.start():]
                  else:
                      footer = footer.replace('</footer>', socials + '</footer>')

              text = text[:match.start()] + footer + text[match.end():]
              path.write_text(text, encoding='utf-8')

          for page in root_pages + blog_pages:
              if page.exists():
                  update_footer(page)

          readme = Path('readme.md')
          readme.write_text(
              '# Rochelle V. Silvestre | Independent VA + Operations\n\n'
              'Official website and publishing repository for Rochelle V. Silvestre.\n\n'
              '## Live site\n\n'
              '- Main website: https://rrlvsva.wasmer.app/\n'
              '- The Rochelle Edit: https://rrlvsva.wasmer.app/blog/\n'
              '- Blog archive: https://rrlvsva.wasmer.app/blog/archive.html\n\n'
              '## Structure\n\n'
              '- `main` contains the public website and live blog content store.\n'
              '- `backend-deploy` contains the Wasmer inquiry, admin authentication, and blog publishing backend.\n'
              '- Blog publishing is managed through the protected admin rather than by editing public HTML manually.\n\n'
              'Site and portfolio maintained independently.\n',
              encoding='utf-8'
          )
          PY

          rm -rf experiments
          rm -f deployment-note.txt portfolio-setup.txt
          rm -f .github/workflows/one-time-fix-index-review.yml
          rm -f .github/workflows/one-time-wire-all-contact-forms.yml
          rm -f .github/workflows/wire-contact-forms.yml
          rm -f backend/apply_contact_forms.py backend/fix_index_review_layout.py
          rm -f .github/workflows/site-cleanup-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were needed."
            exit 0
          fi
          git commit -m "Clean site clutter and add social footer links"
          git push origin HEAD:main

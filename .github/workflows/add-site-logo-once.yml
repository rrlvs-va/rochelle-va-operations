name: One-time logo placement update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-site-logo-once.yml'

permissions:
  contents: write

jobs:
  add-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add logo to public navigation and footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root_pages = [
              Path('index.html'),
              Path('about.html'),
              Path('faq.html'),
              Path('service-policies.html'),
              Path('privacy.html'),
          ]
          blog_pages = [
              Path('blog/index.html'),
              Path('blog/archive.html'),
              Path('blog/article.html'),
          ]

          css = r'''
/* SITE LOGO */
.brand.site-branding{flex-direction:row;align-items:center;gap:10px}
.brand-copy{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.site-logo{width:44px;height:44px;object-fit:contain;flex:0 0 auto;display:block}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-logo{width:58px;height:58px;object-fit:contain;flex:0 0 auto;display:block}
@media(max-width:720px){.site-logo{width:38px;height:38px}.footer-logo{width:50px;height:50px}.footer-brand{align-items:flex-start}}
'''

          brand_re = re.compile(
              r'(<a\s+class="brand"[^>]*>)(\s*<strong>.*?</strong>\s*<span>.*?</span>\s*)(</a>)',
              re.S | re.I,
          )
          footer_re = re.compile(
              r'<div><strong>Rochelle V\. Silvestre</strong><br>Independent VA \+ Operations<br><span([^>]*)>© 2026 Rochelle V\. Silvestre · Site & portfolio maintained independently\.</span></div>',
              re.I,
          )

          for path in root_pages + blog_pages:
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              logo_src = 'assets/rochelle-v-silvestre-logo.png' if path in root_pages else '../assets/rochelle-v-silvestre-logo.png'

              if 'class="site-logo"' not in text:
                  def brand_replace(m):
                      opener = m.group(1).replace('class="brand"', 'class="brand site-branding"', 1)
                      inner = m.group(2).strip()
                      return (
                          opener
                          + f'<img class="site-logo" src="{logo_src}" alt="" width="128" height="128" decoding="async">'
                          + f'<div class="brand-copy">{inner}</div>'
                          + m.group(3)
                      )
                  text, _ = brand_re.subn(brand_replace, text, count=1)

              if 'class="footer-logo"' not in text:
                  def footer_replace(m):
                      attrs = m.group(1)
                      return (
                          '<div class="footer-brand">'
                          f'<img class="footer-logo" src="{logo_src}" alt="Rochelle V. Silvestre — VA + Operations logo" width="128" height="128" loading="lazy" decoding="async">'
                          '<div><strong>Rochelle V. Silvestre</strong><br>Independent VA + Operations<br>'
                          f'<span{attrs}>© 2026 Rochelle V. Silvestre · Site & portfolio maintained independently.</span></div>'
                          '</div>'
                      )
                  text, _ = footer_re.subn(footer_replace, text, count=1)

              if '/* SITE LOGO */' not in text:
                  text = text.replace('</style>', css + '\n</style>', 1)

              path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/add-site-logo-once.yml

      - name: Commit logo placement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add logo to public navigation and footers"
          git push origin HEAD:main

name: One-time responsive repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-responsive-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        run: echo "Responsive repair runner ready"

name: One-time fix index review layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-index-review.yml

permissions:
  contents: write

jobs:
  repair-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair review attribution and remove redundant contact button
        run: python backend/fix_index_review_layout.py

      - name: Commit index repair
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair review attribution layout and simplify contact intro"
          git push origin HEAD:main

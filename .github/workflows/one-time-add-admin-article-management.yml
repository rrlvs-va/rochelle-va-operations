name: One-time add admin article management

on:
  push:
    branches:
      - backend-deploy
    paths:
      - .github/workflows/one-time-add-admin-article-management.yml

permissions:
  contents: write

jobs:
  patch-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend deployment branch
        uses: actions/checkout@v4
        with:
          ref: backend-deploy

      - name: Add article management and hover states
        run: python backend/add_article_management.py

      - name: Commit backend changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add protected article management interface"
          git push origin HEAD:backend-deploy

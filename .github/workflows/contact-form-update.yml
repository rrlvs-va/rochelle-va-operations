name: Apply contact form preference update

on:
  push:
    branches:
      - feature/inquiry-notifications-v2

permissions:
  contents: write

jobs:
  update-contact-forms:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inquiry-notifications-v2

      - name: Add collaboration contact choices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '<label class="form-option"><input type="radio" name="preferredContact" value="MS Teams">MS Teams</label></div></div>'
          new = (
              '<label class="form-option"><input type="radio" name="preferredContact" value="MS Teams">MS Teams</label>'
              '<label class="form-option"><input type="radio" name="preferredContact" value="Asana">Asana</label>'
              '<label class="form-option"><input type="radio" name="preferredContact" value="monday.com">monday.com</label>'
              '<label class="form-option"><input type="radio" name="preferredContact" value="Slack">Slack</label>'
              '<label class="form-option"><input type="radio" name="preferredContact" value="Atlassian / Jira">Atlassian / Jira</label>'
              '</div></div>'
              '<div class="form-field"><label class="form-label" for="contactDetails">Platform / workspace details <span class="optional">(optional)</span></label>'
              '<input id="contactDetails" name="contactDetails" type="text" maxlength="500" placeholder="Meeting link, workspace link, username, or other contact detail">'
              '<p class="form-help">Useful for Meet, Zoom, Teams, Asana, monday.com, Slack, or Atlassian / Jira.</p></div>'
          )

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if not count:
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(f'{path} ({count})')

          if not changed:
              raise SystemExit('No matching contact forms were found; no files changed.')

          print('Updated: ' + ', '.join(changed))
          PY

      - name: Commit form updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "feat: add collaboration contact preferences"
          git push origin HEAD:feature/inquiry-notifications-v2
